name: Code Test
on:
  push:
    branches:
      - master
      - dev
  pull_request:
    types:
      - ready_for_review
      - opened
      - synchronize
      - reopened
    branches:
      - master
      - dev

jobs:
  lint:
    name: Linting code
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: 1.26
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-go-test-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-go-test-

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          args: --config .golangci-action.yml
          skip-cache: true
