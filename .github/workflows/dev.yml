name: Deploy Dev
on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: development
    if: ${{ ! startsWith(github.event.head_commit.message, 'docs') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Creating Docker Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=development

      - name: Add version file to binary
        run: |
          echo "development" > internal/app/core/util/app/ver/version.txt

      - name: Building Binary
        run: |
          CGO_ENABLED=0 go build -o ./bin/api ./cmd/api/main.go
          CGO_ENABLED=0 go build -o ./bin/migrator ./cmd/migrator/main.go

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_NAME }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Final layer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./github-action.Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploying Own
    runs-on: ubuntu-latest
    environment: development
    needs:
      - build
    steps:
      - name: Creating Docker Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=development

      - name: Change Server Config
        run: |
          curl --fail-with-body --location --request PATCH '${{ secrets.DEV_COOLIFY_URL }}/api/v1/applications/${{ secrets.DEV_APP_ID }}' \
            --header 'Content-Type: application/json' \
            --header 'Authorization: Bearer ${{ secrets.DEV_COOLIFY_TOKEN }}' \
            --data '{
                "docker_registry_image_name": "${{ secrets.DOCKER_IMAGE }}",
                "docker_registry_image_tag": "${{ steps.meta.outputs.version }}"
            }'

      - name: Deploy to Coolify
        run: |
          curl --fail-with-body --request GET '${{ secrets.DEV_COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.DEV_APP_ID }}&force=false' \
          --header 'Authorization: Bearer ${{ secrets.DEV_COOLIFY_TOKEN }}'
